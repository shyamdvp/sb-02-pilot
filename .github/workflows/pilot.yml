name: Pilot

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  marker:
    name: Pilot marker
    runs-on: ubuntu-latest
    steps:
      - name: Require the exact pilot marker on pull requests
        if: github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          actual="$(mktemp)"
          code="$(curl -sS -o "$actual" -w "%{http_code}" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github.raw" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/Docs/sb-02-pilot.md?ref=${HEAD_SHA}")"
          if [ "$code" != "200" ]; then
            echo "Docs/sb-02-pilot.md must exist on the pull request head. HTTP ${code}."
            exit 1
          fi
          expected="$(mktemp)"
          printf '%s\n' 'SB-02 pilot marker' > "$expected"
          if ! cmp -s "$expected" "$actual"; then
            echo "Docs/sb-02-pilot.md must contain exactly 'SB-02 pilot marker' followed by one newline."
            echo "Actual bytes:"
            od -An -tx1 "$actual"
            exit 1
          fi
          echo "Pilot marker matches."

      - name: Allow main before the marker file exists
        if: github.event_name == 'push'
        shell: bash
        run: echo "Push to main does not require Docs/sb-02-pilot.md."
